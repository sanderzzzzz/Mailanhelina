  return ai.some((w) => t.includes(w) || c.includes(w.replace(/\s+/g, "")));
}

// Проверка вопросов о личности, имени и фактах об Ангелине
function matchAngelina(t) {
  const c = t.replace(/\s+/g, "");
  const about = [
    "как меня зовут", "как меня звать", "кто я", "кто я такая", "ты меня знаешь",
    "что ты обо мне знаешь", "что ты знаешь обо мне", "расскажи обо мне", "помнишь меня",
    "ты меня помнишь", "что ты про меня знаешь", "расскажи про меня", "мое имя", "моё имя"
  ];
  return about.some((w) => t.includes(w) || c.includes(w.replace(/\s+/g, "")));
}

// Проверка вопросов о Сергее без перехвата вопросов об источнике информации об Ангелине
function matchSergey(t) {
  if (matchSource(t)) return false;
  return /(^| )(серг\S*|серж\S*|серег\S*|сереж\S*|создател\S*)( |$)/.test(t);
}

// Проверка ласковой благодарности «спасибки» до общих правил подтверждения
function matchSpasibki(t) {
  return /(^| )спасибк\S*( |$)/.test(t);
}

// Приоритетный разбор ключевых групп перед общими правилами
function checkPriority(raw) {
  try {
    const t = norm(raw);
    if (!t) return null;
    if (matchSpasibki(t)) return MSG_SPASIBKI;
    if (matchSource(t)) return MSG_SOURCE;
    if (matchInsult(t)) return MSG_INSULT;
    if (matchAi(t)) return MSG_AI;
    if (matchSergey(t)) return MSG_SERGEY;
    if (matchAngelina(t)) return pick(MSG_ANGELINA);
    return null;
  } catch (e) {
    return null;
  }
}

// Определяет контекст последней реплики Сатору для корректного «расскажи ещё / а ещё? / дальше?»
function detectReplyContext(text) {
  const s = String(text || "");
  if (s.includes("последнее слово: мяу") || s.includes("зачёте") || s.includes("шпагате") || s.includes("мяу-эстетика") || s.includes("Короткая шутка")) {
    return "joke";
  }
  if (s.includes("Что это?") || s.includes("загадку")) {
    return "riddle";
  }
  return null;
}

// Локальный разбор сообщений с защитой от исключений
function reply(raw) {
  try {
    const prioMsg = checkPriority(raw);
    if (prioMsg) {
      pending = null;
      return { a: prioMsg, i: 1 };
    }

    const t = norm(raw);
    const q = /\?/.test(raw);

    if (/не хочу (никого|ни с кем|никому)|никого не хочу|хочу побыть одн|ничего не хочу$/.test(t)) {
      pending = null;
      return {
        a: pick([
          "Понимаю, Ангелина. Иногда нужна тишина, и это нормально. Можно ничего не рассказывать, я просто посижу тихонько рядом.",
          "Устала и хочется тишины: так бывает после напряжённых дней. Без разговоров: плед, тёплое питьё, спокойная музыка. Напиши мне, когда захочется.",
          "Побыть одной тоже забота о себе. Если такое состояние тянется долго или становится тяжёлым, скажи об этом близкому человеку или обратись к специалисту. А сейчас отдыхай, я тут."
        ]),
        i: 1
      };
    }

    const hit = R.find((r) => r[0].test(t));
    const prio = Boolean(hit && hit[2] && hit[2].includes("p"));

    if (pending && !prio) {
      const p = pending;
      pending = null;
      if (p === "why") return { a: pick(SUP), f: "u", i: 1 };
      if (p === "mood") {
        if (
          /(^| )не ?плох/.test(t) ||
          (!/плох|не очень|не оч|груст|ужас|тяжел|так себе|паршив|устал|печал/.test(t) &&
            /хорош|нормальн|отличн|супер|прекрасн|замечательн|класс|здорово/.test(t))
        ) {
          return { a: "Хорошо, замечательно, что у вас хорошо.", f: "u", i: 1 };
        }
        if (/плох|не очень|не оч|груст|ужас|тяжел|так себе|паршив|устал|печал/.test(t)) {
          pending = "why";
          return { a: "Почему у тебя плохо?", i: 1 };
        }
      }
    }

    pending = null;
    if (hit) {
      if (hit[2] && hit[2].includes("m")) pending = "mood";
      return { a: pick(hit[1]), f: hit[2] || "", i: prio ? 1 : 0 };
    }

    return {
      a: q
        ? "Мрр… этого я не знаю. Зато могу рассказать про тебя, учёбу, танцы или просто побыть рядом."
        : "Мур, я слушаю тебя. Если хочешь что-то спросить, напиши со знаком вопроса."
    };
  } catch (e) {
    return {
      a: "Мур, я слушаю тебя. Если хочешь что-то спросить, напиши со знаком вопроса.",
      i: 1
    };
  }
}

// Генерация мягкого кошачьего мурчания через Web Audio API
let ctx = null;
let on = false;

function purr(d = 1.8) {
  if (!on) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const f = ctx.createBiquadFilter();
    const g = ctx.createGain();
    const l = ctx.createOscillator();
    const lg = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.value = 58;
    f.type = "lowpass";
    f.frequency.value = 220;
    l.frequency.value = 24;
    lg.gain.value = 0.05;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.25);
    g.gain.linearRampToValueAtTime(0, t + d);
    l.connect(lg);
    lg.connect(g.gain);
    o.connect(f);
    f.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    l.start(t);
    o.stop(t + d + 0.1);
    l.stop(t + d + 0.1);
  } catch (e) {}
}

$("#snd").onclick = () => {
  on = !on;
  $("#snd").textContent = "Звук: " + (on ? "вкл" : "выкл");
  if (on) purr(1.5);
};

    purr();
  }
}

async function ask(r) {
  busy = true;
  const my = ac = new AbortController();
  try {
    $("#out").textContent = "Сатору мурлычет и думает…";
    badge.textContent = "Думает и мурчит";
    await new Promise((s) => setTimeout(s, 120));
    if (my !== ac) return;
    show({ a: r.a, f: r.f || "" });
  } catch (e) {
    if (my === ac) show({ a: r.a || "Мур, я здесь!", f: "" });
  } finally {
    if (my === ac) {
      busy = false;
      ac = null;
    }
  }
}

async function send(txt) {
  try {
    txt = String(txt || "").trim();
    if (!txt || busy) return;
    const prioMsg = checkPriority(txt);
    const r = prioMsg ? { a: prioMsg, i: 1 } : reply(txt);
    dlg.push({ role: "user", content: txt });
    if (r.i) show(r);
    const idx = hist.indexOf(txt);
    if (idx > -1) hist.splice(idx, 1);
    hist.unshift(txt);
    if (hist.length > 6) hist.pop();
    const c = $("#chips");
    c.textContent = "";
    hist.forEach((h) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = h;
      b.onclick = () => send(h);
      c.appendChild(b);
    });
    $("#inp").value = "";
    if (!r.i) await ask(r);
  } catch (e) {
    $("#out").textContent = "Мур! Я здесь и слушаю тебя ♡";
    badge.textContent = "Мурчит и слушает";
  } finally {
    busy = false;
    ac = null;
  }
}

$("#send").onclick = () => send($("#inp").value);
$("#inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send($("#inp").value);
});

$("#rst").onclick = () => {

  lastContextKind = null;
  dlg.length = 0;
  if (ac) ac.abort();

  busy = false;

  badge.textContent = "Мурчит и слушает";

};

  const RID = [
    ["Зимой и летом одним цветом. Что это?", "елк", "ёлка"],

  function topic(tk) {

    let bs = 0;
    for (const id in T) {
      let s = 0;
      for (const k of T[id].k.split(" ")) {
        const ex = k.endsWith("$");

        bs = s;
        b = id;

    return [b, bs];

      const prioMsg = checkPriority(raw);
      if (prioMsg) return prioMsg;

      const t = norm(raw);
      const q = /\?/.test(raw);
      const tk = t.split(" ");

      if (/не хочу жить|хочу умереть|покончить с собой|навредить себе|убить себя/.test(t)) {
        return "Мне очень важно, что ты это сказала. Пожалуйста, прямо сейчас напиши или позвони близкому человеку и скажи, что тебе тяжело. Если ты в опасности, звони 112. Ты не одна, я рядом.";
      }

      if (/я (совсем |очень |такая )?(не ?красив|некрасив|страшн|урод|толст|безобразн)|я себе не нравлюсь|ненавижу (свою внешность|себя)|мне кажется,? что я (не ?красив|некрасив|страшн)/.test(t)) {

          "Мне жаль, что ты так сказала, и я с этим не согласен. У тебя красивые голубо-серые глаза и светлые волосы, а ещё доброта и чувство юмора, которые видны во всём. Иногда такие мысли приходят, когда устаёшь или кто-то сказал обидное. Что случилось?",

          "Я не хочу, чтобы ты так про себя думала. Для меня ты красивая, и дело не только во внешности. Если такие мысли приходят часто и давят, поговори с близким человеком или психологом, в этом нет ничего стыдного. А мне расскажешь, что произошло?"
        ], "self");
      }

      if (rid) {
        const x = rid;
        rid = null;
        return t.includes(x[1])
          ? "Верно! Ты умница, мур! Хочешь ещё? Напиши «загадка»."
          : "Почти! Это " + x[2] + ". Хочешь ещё загадку?";
      }

      if (/который час|сколько (сейчас )?времени/.test(t)) {
        return "Сейчас " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) + " по времени твоего устройства. Мур!";
      }

      if (/какое (сегодня )?число|какой (сегодня )?(день|день недели)/.test(t)) {
        return "Сегодня " + new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" }) + ".";
      }

      const m0 = raw.toLowerCase().replace(/сколько будет|посчитай|равно|=/g, "").replace(/[x×]/g, "*").replace(/[÷:]/g, "/").replace(/,/g, ".").trim();
      if (/\d/.test(m0) && /^[\d+\-*/(). ]+$/.test(m0) && /[+\-*/]/.test(m0) && m0.length < 40) {
        try {
          const v = Function('"use strict";return(' + m0 + ")")();
          if (isFinite(v)) return "Получается " + (Math.round(v * 1e6) / 1e6) + ". Мур, я неплох в счёте!";
        } catch (e) {}
      }

      if (/я (тебя )?люблю тебя|я тебя люблю/.test(t)) return "Мур-мур, и я тебя! ♡ Ты самая замечательная.";

        rid = pick(RID);

      if (/орел или решк|подбрось монет/.test(t)) return pick(["Выпал орёл!", "Выпала решка!"]);

        return likes.length
          ? "Ты рассказывала: " + likes.join("; ") + ". Добавим что-нибудь?"

      const lk = t.match(/(?:^| )(?:я люблю|мне нравится|мне нравятся|обожаю|увлекаюсь) (.{2,40})$/);
      if (lk && !q && !/тебя|меня/.test(lk[1])) {

          "Записал в кошачью память: «" + lk[1] + "». Расскажешь, что в этом самое классное?",

      if (/^(еще|а еще|подробнее|расскажи еще|продолжай|дальше|а дальше|почему)$/.test(t)) {
        if (lastContextKind === "joke") return pick(JOKE);
        if (lastContextKind === "riddle") {
          rid = pick(RID);
          return rid[0];
        }
        return last ? pk(T[last].a, last) : "О чём рассказать подробнее: про учёбу, танцы или что-то ещё?";

      if (/глуп|туп|дурак|ненавижу тебя|плохой кот/.test(t)) return MSG_INSULT;

      const [id, s] = topic(tk);
      const old = r && r.i === 0;

        "Ого! Расскажи подробнее, мне интересно.",
        "Я слушаю, продолжай. Что было дальше?",
        "Мррр, понятно. А как ты сама к этому относишься?"
      ], "gs");
    } catch (e) {
      return r && r.a ? r.a : "Мур, я слушаю тебя. Если хочешь что-то спросить, напиши со знаком вопроса.";
    }

      if (my === ac) show({ a: r && r.a ? r.a : "Мур, я здесь!", f: "" });

  // Тихая самопроверка ключевых сценариев в консоли без засорения интерфейса
  window.runSatoruSelfTest = function () {
    const checks = [
      ["привет", "Привет"],
      ["спасибки", MSG_SPASIBKI],
      ["спасибки!", MSG_SPASIBKI],
      ["ты дурак", MSG_INSULT],
      ["ты ии?", MSG_AI],
      ["откуда информация?", MSG_SOURCE],
      ["как меня зовут?", "Ангелина"],
      ["чем ты можешь помочь?", "выслушать"],
      ["пошути", "мур"],
      ["ты сейчас спишь?", "не сплю"],
      ["что поделать?", "потанцевать"],
      ["а ты правда кот?", "цифровой"],
      ["как подготовиться к семинару?", "семинару"],
      ["как всё успевать?", "одно самое главное"],
      ["что сделать после тренировки?", "воды"],
      ["волнуюсь перед выступлением", "четыре счёта"],
      ["прикольно", "Мур"],
      ["скучная пара", "под партой"],
      ["сижу на паре", "преподаватель"],
      ["занимаюсь всякой фигнёй на паре", "конспект"],
      ["сижу на танцах", "лови ритм"],
      ["устала на паре", "домой отдыхать"],
      ["перемена", "потянуться"],
      ["на тренировке", "тренировке"],
      ["пара просто скучно, делать нечего", "звонка"],
      ["буду на концерте выступать", "сцене"],
      ["мы сейчас на танцах", "ножки"]
    ];
    const results = checks.map(([prompt, expectedPart]) => {
      const p = checkPriority(prompt);
      const ans = p || smart(prompt, reply(prompt));
      return { prompt, ok: ans.toLowerCase().includes(expectedPart.toLowerCase()), ans };
    });
    if (window.console && typeof console.info === "function") {
      console.info("Сатору self-test:", results.every((x) => x.ok) ? "OK" : results);
    }
    return results;
  };
})();

window.addEventListener("load", () => {
  try {
    if (typeof window.runSatoruSelfTest === "function") {
      window.runSatoruSelfTest();
    }
  } catch (e) {}
});
